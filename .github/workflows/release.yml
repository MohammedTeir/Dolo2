name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Lint & Tests
      run: ./gradlew lint test

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Sign Release APK
      id: sign_app
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.jks
        APK_SIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -1)
        for apk in app/build/outputs/apk/release/*.apk; do
          if [[ $apk != *"unsigned"* ]]; then
            $APK_SIGNER sign --ks release.jks \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
              --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
              --out "${apk%.apk}-signed.apk" "$apk"
          fi
        done

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/release/*-signed.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
